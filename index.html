<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chisom-Lab | Cultural Sonic Archive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="starfield"></canvas>

    <main class="container">
        <header class="hero">
            <span class="badge">AESTHETIC & TECHNOLOGY</span>
            <h1>CHISOM-LAB</h1>
            <p class="subtitle">Where ancient Igbo heritage meets high-end frontend craftsmanship.</p>
            <div id="proverb-box" class="proverb">"Egwu ma mma, a naa n'uba." — Sound & culture woven into code.</div>
        </header>

        <section class="archive-card">
            <div class="vinyl-container">
                <div class="vinyl-disc" id="vinylDisc">
                    <div class="vinyl-label">CHISOM</div>
                </div>
            </div>
            
            <div class="archive-info">
                <h2>Odogwu Sound Archive Vol. I</h2>
                <p>Ogene & Igbo Cultural Soundscape • Tap to Play</p>
            </div>

            <!-- Preloaded robust audio stream with cross-origin safety -->
            <audio id="culturalAudio" crossorigin="anonymous" preload="auto">
                <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=african-drums-113200.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            
            <button class="play-btn" id="playBtn" type="button">PLAY ARCHIVE</button>
        </section>
    </main>

    <footer>
        <p>DESIGNED & DEVELOPED BY CHISOM • 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
